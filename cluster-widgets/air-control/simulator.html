<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GWM H6 GT - Instrument Cluster Simulator</title>
  <link rel="stylesheet" href="./src/night.style.css">
  <link rel="stylesheet" href="./src/main.menu.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #e5e7eb;
    }

    /* Painel do instrumento - resolução real H6 GT */
    .instrument-panel {
      width: 100%;
      height: 480px;
      background: #000;
      border-bottom: 1px solid #1f2937;
      flex-shrink: 0;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    /* Controles abaixo */
    .simulator-controls {
      flex: 1;
      display: flex;
      overflow: hidden;
      background: #0a0a0a;
    }

    .control-panel {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      border-right: 1px solid #1f2937;
      min-width: 280px;
    }

    .control-panel:last-child {
      border-right: none;
    }

    .control-panel h3 {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7280;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .control-label {
      color: #9ca3af;
      min-width: 120px;
    }

    .control-input {
      flex: 1;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #e5e7eb;
      font-size: 11px;
    }

    .control-input:focus {
      outline: none;
      border-color: #3b82f6;
      background: #2a2f37;
    }

    .theme-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .theme-btn {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #e5e7eb;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .theme-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #fff;
    }

    .theme-btn:hover:not(.active) {
      background: #374151;
    }

    .slider-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .slider-wrapper input {
      flex: 1;
      accent-color: #3b82f6;
    }

    .slider-value {
      color: #60a5fa;
      min-width: 40px;
      text-align: right;
      font-size: 11px;
    }

    .log-container {
      max-height: 100%;
      overflow-y: auto;
      padding: 8px;
      background: #111;
      border-radius: 4px;
      font-family: monospace;
      font-size: 10px;
    }

    .log-entry {
      display: flex;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px solid #0d0d0d;
      color: #9ca3af;
    }

    .log-entry .log-time {
      color: #6b7280;
      min-width: 90px;
      flex-shrink: 0;
    }

    .log-entry .log-msg {
      color: #a3e635;
      flex: 1;
    }

    .control-panel::-webkit-scrollbar { width: 5px; }
    .control-panel::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    .log-container::-webkit-scrollbar { width: 5px; }
    .log-container::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="instrument-panel">
    <div id="app"></div>
  </div>

  <div class="simulator-controls">
    <div class="control-panel" id="display-panel">
      <h3>🎨 Tema & Display</h3>
      <div id="theme-controls"></div>
    </div>

    <div class="control-panel" id="vehicle-panel">
      <h3>🚗 Veículo & Sensores</h3>
      <div id="vehicle-controls"></div>
    </div>

    <div class="control-panel" id="log-panel">
      <h3>📊 Log de Eventos</h3>
      <div class="log-container" id="log-container"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/dev/simulator-ui.js"></script>
</body>
</html>
