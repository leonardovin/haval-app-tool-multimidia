<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GWM Dev Simulator</title>
    <link rel="stylesheet" href="/src/night.style.css">
    <link rel="stylesheet" href="/src/main.menu.css">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #0a0a0a;
        display: flex;
        height: 100vh;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #e5e7eb;
      }

      .sim-cluster-frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 500px;
        background: #111;
        border-right: 1px solid #222;
        gap: 12px;
        padding: 24px;
      }

      .cluster-label {
        font-size: 11px;
        color: #4b5563;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .cluster-circle {
        width: 452px;
        height: 452px;
        border-radius: 50%;
        overflow: hidden;
        background: #000;
        border: 2px solid #222;
        position: relative;
        flex-shrink: 0;
      }

      .cluster-circle #app {
        width: 100%;
        height: 100%;
      }

      .sim-panel {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #0f0f0f;
      }
    </style>
  </head>
  <body>
    <div class="sim-cluster-frame">
      <span class="cluster-label">Instrument Cluster · Display 1</span>
      <div class="cluster-circle">
        <div id="app"></div>
      </div>
    </div>
    <div class="sim-panel" id="sim-panel"></div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/dev/simulator.js"></script>
  </body>
</html>
